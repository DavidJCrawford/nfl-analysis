name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['Docs/**', 'README.md', '**/*.md']
  workflow_dispatch:

# CI never fetches from F1. Ingest runs locally on a residential connection and
# its output is committed — see Docs/HANDOFF.md.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - name: Type check
        run: npm run check

      # Astro's incremental build cache. Keyed on the emitted data so a data
      # change invalidates and nothing else does. Without this restore step
      # nothing is skipped and the 10-minute deploy window gets tight.
      - name: Restore incremental build cache
        uses: actions/cache@v6
        with:
          path: site/node_modules/.astro
          key: astro-${{ hashFiles('site/data/**/*.json') }}
          restore-keys: astro-

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # The published-site ceiling is 1 GB. Fail early, not at deploy time.
      - name: Size gate
        run: |
          BYTES=$(du -sb dist | cut -f1)
          echo "dist: $(du -sh dist | cut -f1)"
          if [ "$BYTES" -gt 734003200 ]; then
            echo "::error::dist exceeds the 700 MB gate (1 GB is the hard Pages limit)"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
